name: Release theme
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: theme-releases
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: tech-bytes-playground-runner
    container: node:24-bookworm
    steps:
      - name: Install workflow tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gh jq unzip python3 build-essential
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish pending merged PRs in branch order
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs
