name: Release theme
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: theme-releases
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch)
    runs-on: tech-bytes-playground-runner
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install workflow tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git jq unzip python3 build-essential
      - name: Install GitHub CLI
        run: |
          sudo mkdir -p -m 755 /etc/apt/keyrings
          curl --fail --silent --show-error --location https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gh
          gh --version
          gh api --help | grep -q -- '--slurp'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create release app token
        id: release-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write
      - name: Configure release Git authentication
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: gh auth setup-git
      - name: Publish pending merged PRs in branch order
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release.mjs
