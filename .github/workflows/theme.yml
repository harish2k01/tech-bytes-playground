name: Validate theme
on:
  push:
  pull_request:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  theme:
    name: Theme validation
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'tech-bytes-playground-runner' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install workflow tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl git gh jq unzip python3 build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: tech-bytes-playground
          path: dist/*.zip
